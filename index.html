<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Cervezas - Ley de Pureza de 1516</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #d97706;
            --primary-hover: #b45309;
            --success-bg: #dcfce7;
            --success-text: #15803d;
            --danger-bg: #fee2e2;
            --danger-text: #b91c1c;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Buscador */
        .search-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: var(--radius);
            padding: 6px 16px;
            box-shadow: var(--shadow);
            transition: border-color 0.2s ease;
        }

        .search-box:focus-within {
            border-color: var(--primary);
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            padding: 10px;
            font-size: 1rem;
            color: var(--text-main);
            background: transparent;
        }

        .search-box .clear-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: none;
        }

        /* Desplegable de sugerencias */
        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            margin-top: 6px;
            max-height: 250px;
            overflow-y: auto;
            box-shadow: var(--shadow);
            z-index: 100;
            display: none;
        }

        .suggestion-item {
            padding: 10px 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover {
            background-color: #f1f5f9;
        }

        .suggestion-item .brand {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Filtros rápidos */
        .filter-tags {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .tag-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-muted);
        }

        .tag-btn.active, .tag-btn:hover {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        /* Grid de Cervezas */
        .beer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .beer-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .beer-card h3 {
            font-size: 1.2rem;
            margin-bottom: 4px;
        }

        .beer-card .brewery {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 12px;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 12px;
            align-self: flex-start;
        }

        .badge.pure {
            background: var(--success-bg);
            color: var(--success-text);
        }

        .badge.adjuncts {
            background: var(--danger-bg);
            color: var(--danger-text);
        }

        .details-list {
            font-size: 0.88rem;
            color: var(--text-main);
            margin-bottom: 16px;
        }

        .details-list li {
            list-style: none;
            margin-bottom: 4px;
        }

        .btn-modal {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s ease;
        }

        .btn-modal:hover {
            background: #e2e8f0;
        }

        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            padding: 40px;
            color: var(--text-muted);
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px dashed var(--border-color);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 24px;
            border-radius: var(--radius);
            max-width: 500px;
            width: 100%;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            border: none;
            background: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .modal-content h2 {
            margin-bottom: 6px;
            color: var(--primary);
        }

        .modal-section {
            margin-top: 16px;
        }

        .modal-section h4 {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Buscador de Cervezas</h1>
            <p>Comprueba el cumplimiento de la Ley de Pureza Alemana de 1516 (Reinheitsgebot)</p>
        </header>

        <!-- Buscador -->
        <div class="search-wrapper">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Busca por marca, nombre, EAN o ingrediente (ej. 'cruz', 'mahou', 'arroz')..." autocomplete="off">
                <button class="clear-btn" id="clearBtn" title="Limpiar">&times;</button>
            </div>
            <div class="suggestions-list" id="suggestionsList"></div>
        </div>

        <!-- Filtros Rápidos -->
        <div class="filter-tags">
            <button class="tag-btn active" data-filter="all">Todas</button>
            <button class="tag-btn" data-filter="pure">Solo Cumple Ley Pureza</button>
            <button class="tag-btn" data-filter="adjuncts">Con Adjuntos / No Cumple</button>
        </div>

        <!-- Resultados -->
        <div class="beer-grid" id="beerGrid"></div>
    </div>

    <!-- Modal Detalle -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <h2 id="modalTitle">Nombre Cerveza</h2>
            <p id="modalBrewery" class="brewery">Marca / Cervecería</p>
            
            <div id="modalBadge" class="badge"></div>

            <div class="modal-section">
                <h4>Estilo y Origen</h4>
                <p id="modalStyleOrigin">-</p>
            </div>

            <div class="modal-section">
                <h4>Ingredientes</h4>
                <p id="modalIngredients">-</p>
            </div>

            <div class="modal-section" id="modalAdjunctsSection">
                <h4>Detalle de Adjuntos / Aditivos</h4>
                <p id="modalAdjunctsDetail">-</p>
            </div>

            <div class="modal-section">
                <h4>Código EAN-13</h4>
                <p id="modalEAN">-</p>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // BASE DE DATOS DE CERVEZAS
        // ==========================================
        const baseDatosCervezas = [
            {
                id: 1,
                nombre: "Cruzcampo Especial",
                marca: "Heineken España",
                estilo: "Lager Pilsen",
                alcohol: "5.6%",
                origen: "Sevilla, España",
                ean: "8410298001012",
                cumple_ley_pureza: false,
                ingredientes: ["Agua", "Malta de cebada", "Maíz", "Lúpulo", "Extracto de lúpulo"],
                adjuntos_detalle: "Contiene maíz como adjunto cervecero y extracto de lúpulo."
            },
            {
                id: 2,
                nombre: "Cruz del Sur",
                marca: "Cervecería del Sur",
                estilo: "Golden Ale",
                alcohol: "4.8%",
                origen: "Mendoza, Argentina",
                ean: "7791234567890",
                cumple_ley_pureza: true,
                ingredientes: ["Agua de deshielo", "Malta de cebada", "Lúpulo", "Levadura"],
                adjuntos_detalle: "Sin adjuntos ni aditivos. Fabricada bajo tradición clásica."
            },
            {
                id: 3,
                nombre: "Mahou Cinco Estrellas",
                marca: "Mahou-San Miguel",
                estilo: "Lager Pilsen",
                alcohol: "5.5%",
                origen: "Madrid, España",
                ean: "8410790000010",
                cumple_ley_pureza: false,
                ingredientes: ["Agua", "Malta de cebada", "Maíz", "Lúpulo"],
                adjuntos_detalle: "Contiene maíz no malteado para aligerar cuerpo."
            },
            {
                id: 4,
                nombre: "Estrella Galicia Especial",
                marca: "Hijos de Rivera",
                estilo: "Lager Especial",
                alcohol: "5.5%",
                origen: "A Coruña, España",
                ean: "8412599000019",
                cumple_ley_pureza: false,
                ingredientes: ["Agua", "Malta de cebada", "Maíz", "Lúpulo"],
                adjuntos_detalle: "Utiliza maíz en su receta tradicional."
            },
            {
                id: 5,
                nombre: "Paulaner Hefe-Weißbier",
                marca: "Paulaner Brauerei",
                estilo: "Weissbier (Trigo)",
                alcohol: "5.5%",
                origen: "Múnich, Alemania",
                ean: "4006600000123",
                cumple_ley_pureza: true,
                ingredientes: ["Agua", "Malta de trigo", "Malta de cebada", "Levadura", "Lúpulo"],
                adjuntos_detalle: "100% conforme a la Ley de Pureza Alemana de 1516."
            },
            {
                id: 6,
                nombre: "Augustiner Edelstoff",
                marca: "Augustiner-Bräu",
                estilo: "Export / Helles",
                alcohol: "5.6%",
                origen: "Múnich, Alemania",
                ean: "4014286000015",
                cumple_ley_pureza: true,
                ingredientes: ["Agua", "Malta de cebada", "Lúpulo"],
                adjuntos_detalle: "Elaboración artesanal histórica conforme al Reinheitsgebot."
            },
            {
                id: 7,
                nombre: "Alhambra Reserva 1925",
                marca: "Mahou-San Miguel",
                estilo: "Strong Lager",
                alcohol: "6.4%",
                origen: "Granada, España",
                ean: "8410790022227",
                cumple_ley_pureza: true,
                ingredientes: ["Agua", "Malta de cebada", "Lúpulo", "Levadura"],
                adjuntos_detalle: "No contiene adjuntos. Elaboración limpia con malta 100%."
            },
            {
                id: 8,
                nombre: "Corona Extra",
                marca: "Grupo Modelo / AB InBev",
                estilo: "American Adjunct Lager",
                alcohol: "4.5%",
                origen: "Ciudad de México, México",
                ean: "7501064191122",
                cumple_ley_pureza: false,
                ingredientes: ["Agua", "Malta de cebada", "Arroz", "Maíz", "Lúpulo", "Ascorbato de sodio", "E-405"],
                adjuntos_detalle: "Contiene arroz, maíz y estabilizantes de espuma (E-405)."
            }
        ];

        // ==========================================
        // MOTOR DE BÚSQUEDA Y NORMALIZACIÓN
        // ==========================================

        // Quita acentos, diacríticos y pasa a minúsculas limpia
        function normalizar(texto) {
            if (!texto) return '';
            return texto
                .toString()
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .trim();
        }

        // Verifica si TODOS los términos buscados existen dentro del texto de la cerveza
        function coincideBusqueda(textoDestino, query) {
            const normDestino = normalizar(textoDestino);
            const normQuery = normalizar(query);
            if (!normQuery) return true;

            // Separa por espacios permitiendo buscar múltiples términos (ej: "cruz sur")
            const terminos = normQuery.split(/\s+/).filter(t => t.length > 0);
            return terminos.every(termino => normDestino.includes(termino));
        }

        // Evalúa una cerveza frente al término de búsqueda
        function buscarEnCerveza(cerveza, query) {
            const textoCompleto = [
                cerveza.nombre,
                cerveza.marca,
                cerveza.estilo,
                cerveza.ean,
                cerveza.origen,
                cerveza.ingredientes.join(' '),
                cerveza.adjuntos_detalle
            ].join(' ');

            return coincideBusqueda(textoCompleto, query);
        }

        // ==========================================
        // ESTADO DE LA APLICACIÓN
        // ==========================================
        let filtroActual = 'all';
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const suggestionsList = document.getElementById('suggestionsList');
        const beerGrid = document.getElementById('beerGrid');
        const tagButtons = document.querySelectorAll('.tag-btn');

        // Modales
        const modalOverlay = document.getElementById('modalOverlay');
        const modalClose = document.getElementById('modalClose');

        // ==========================================
        // RENDERIZADO Y UI
        // ==========================================

        function renderResultados() {
            const query = searchInput.value;
            
            // Filtrar elementos
            const resultados = baseDatosCervezas.filter(cerveza => {
                const coincideTexto = buscarEnCerveza(cerveza, query);
                
                let coincideFiltro = true;
                if (filtroActual === 'pure') coincideFiltro = cerveza.cumple_ley_pureza === true;
                if (filtroActual === 'adjuncts') coincideFiltro = cerveza.cumple_ley_pureza === false;

                return coincideTexto && coincideFiltro;
            });

            // Pintar resultados
            beerGrid.innerHTML = '';
            if (resultados.length === 0) {
                beerGrid.innerHTML = `
                    <div class="no-results">
                        <h3>No se encontraron cervezas</h3>
                        <p>Intenta con otros términos como "Cruzcampo", "Cruz del Sur", "Lager" o un código EAN.</p>
                    </div>
                `;
                return;
            }

            resultados.forEach(cerveza => {
                const card = document.createElement('div');
                card.className = 'beer-card';
                card.innerHTML = `
                    <div>
                        <h3>${cerveza.nombre}</h3>
                        <div class="brewery">${cerveza.marca} • ${cerveza.origen}</div>
                        <span class="badge ${cerveza.cumple_ley_pureza ? 'pure' : 'adjuncts'}">
                            ${cerveza.cumple_ley_pureza ? '✓ Cumple Ley Pureza 1516' : '✕ Contiene Adjuntos'}
                        </span>
                        <ul class="details-list">
                            <li><strong>Estilo:</strong> ${cerveza.estilo}</li>
                            <li><strong>Graduación:</strong> ${cerveza.alcohol}</li>
                            <li><strong>Ingredientes:</strong> ${cerveza.ingredientes.join(', ')}</li>
                        </ul>
                    </div>
                    <button class="btn-modal" onclick="abrirModal(${cerveza.id})">Ver ficha detallada</button>
                `;
                beerGrid.appendChild(card);
            });
        }

        // Actualizar Sugerencias en tiempo real
        function actualizarSugerencias() {
            const query = searchInput.value;
            const normQuery = normalizar(query);

            if (normQuery.length < 1) {
                suggestionsList.style.display = 'none';
                return;
            }

            const Coincidencias = baseDatosCervezas.filter(c => buscarEnCerveza(c, query));

            if (Coincidencias.length === 0) {
                suggestionsList.style.display = 'none';
                return;
            }

            suggestionsList.innerHTML = '';
            Coincidencias.forEach(cerveza => {
                const item = document.createElement('div');
                item.className = 'suggestion-item';
                item.innerHTML = `
                    <span><strong>${cerveza.nombre}</strong></span>
                    <span class="brand">${cerveza.marca}</span>
                `;
                item.addEventListener('click', () => {
                    searchInput.value = cerveza.nombre;
                    suggestionsList.style.display = 'none';
                    clearBtn.style.display = 'block';
                    renderResultados();
                });
                suggestionsList.appendChild(item);
            });

            suggestionsList.style.display = 'block';
        }

        // ==========================================
        // FUNCIONES DE MODAL
        // ==========================================
        window.abrirModal = function(id) {
            const cerveza = baseDatosCervezas.find(c => c.id === id);
            if (!cerveza) return;

            document.getElementById('modalTitle').textContent = cerveza.nombre;
            document.getElementById('modalBrewery').textContent = `${cerveza.marca} (${cerveza.origen})`;
            
            const badge = document.getElementById('modalBadge');
            badge.className = `badge ${cerveza.cumple_ley_pureza ? 'pure' : 'adjuncts'}`;
            badge.textContent = cerveza.cumple_ley_pureza 
                ? '✓ Cumple estrictamente la Ley de Pureza Alemana (Reinheitsgebot)' 
                : '✕ No cumple la Ley de Pureza (Contiene adjuntos o aditivos)';

            document.getElementById('modalStyleOrigin').textContent = `${cerveza.estilo} | Graduación: ${cerveza.alcohol}`;
            document.getElementById('modalIngredients').textContent = cerveza.ingredientes.join(', ');
            document.getElementById('modalAdjunctsDetail').textContent = cerveza.adjuntos_detalle;
            document.getElementById('modalEAN').textContent = cerveza.ean;

            modalOverlay.style.display = 'flex';
        };

        function cerrarModal() {
            modalOverlay.style.display = 'none';
        }

        // ==========================================
        // EVENT LISTENERS
        // ==========================================

        searchInput.addEventListener('input', () => {
            const value = searchInput.value;
            clearBtn.style.display = value ? 'block' : 'none';
            actualizarSugerencias();
            renderResultados();
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearBtn.style.display = 'none';
            suggestionsList.style.display = 'none';
            renderResultados();
            searchInput.focus();
        });

        // Ocultar sugerencias si se hace clic fuera
        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !suggestionsList.contains(e.target)) {
                suggestionsList.style.display = 'none';
            }
        });

        // Botones de filtro
        tagButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                tagButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                filtroActual = btn.getAttribute('data-filter');
                renderResultados();
            });
        });

        // Control Modal
        modalClose.addEventListener('click', cerrarModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) cerrarModal();
        });

        // Carga inicial
        renderResultados();
    </script>
</body>
</html>
